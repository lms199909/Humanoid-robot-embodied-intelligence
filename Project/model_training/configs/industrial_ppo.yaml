# 工业装配训练默认超参

seed: 42
device: cuda:0

env:
  task: industrial
  num_envs: 2048
  episode_length_s: 30
  domain_rand: true
  physics_dt: 0.005
  sim_dt: 0.05

algorithm:
  name: ppo
  impl: rsl_rl
  learning_rate: 5.0e-4
  num_steps_per_env: 48
  max_iterations: 1500

mdp:
  rewards:
    grasp: 1.0
    assemble: 2.0
    energy: -0.005
    fall: -10.0
  terminations:
    fall_height: 0.3
    fall_tilt_deg: 60.0
    timeout_steps: 1500

checkpoint:
  save_every: 100
  keep_last: 5
